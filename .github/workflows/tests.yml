name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run deterministic suite
        run: python -B -m unittest discover -s tests -v
      - name: Exercise CLI
        shell: bash
        run: |
          projectreader --help
          projectreader index examples/demo_repository
          projectreader search examples/demo_repository greeting
          projectreader inspect examples/demo_repository greeting
      - name: Exercise MCP tests
        run: python -B -m unittest discover -s tests -p "test_mcp*.py" -v
